
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BubuRemote Client</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #171722;
            color: white;
            font-family: Arial, sans-serif;
        }

        .panel {
            max-width: 420px;
            margin: 40px auto;
            padding: 25px;
            background: #292938;
            border-radius: 18px;
            text-align: center;
        }

        h1 {
            color: #ff9fc8;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid #555;
            border-radius: 10px;
            background: #171722;
            color: white;
            font-size: 22px;
            text-align: center;
            letter-spacing: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #ff75a9;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        #estado {
            margin-top: 20px;
            color: #ffcc66;
        }
    </style>
</head>

<body>
<div class="panel">
    <h1>BubuRemote 💗</h1>

    <p>Conéctate con Arnold</p>

    <input
            id="codigo"
            type="text"
            maxlength="6"
            inputmode="numeric"
            placeholder="000000"
    >

    <button id="conectar" onclick="conectar()">
        Conectar
    </button>

    <button id="microfono" onclick="activarMicrofono()" disabled>
        Activar micrófono
    </button>

    <p id="estado">Esperando conexión...</p>
</div>


<script>
    const SERVIDOR = `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}`;

    let socket;
    let stream;
    let audioContext;
    let fuente;
    let nodoVoz;
    let hablando = false;

    const estado = document.getElementById("estado");
    const botonMicrofono = document.getElementById("microfono");

    function conectar() {
        const codigo = document.getElementById("codigo").value.trim();

        if (!/^\d{6}$/.test(codigo)) {
            estado.textContent = "Introduce un código válido.";
            return;
        }

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
        }

        estado.textContent = "Conectando...";
        botonMicrofono.disabled = true;

        socket = new WebSocket(SERVIDOR);

        socket.onopen = () => {
            socket.send(JSON.stringify({
                tipo: "unirse_sala",
                codigo
            }));
        };

        socket.onmessage = (evento) => {
            const datos = JSON.parse(evento.data);

            if (datos.tipo === "conectado") {
                estado.textContent = "¡Conectada con Arnold!";
                botonMicrofono.disabled = false;
            }

            if (datos.tipo === "error") {
                estado.textContent = datos.mensaje;
            }

            if (datos.tipo === "desconectado") {
                estado.textContent = "Arnold se desconectó.";
                botonMicrofono.disabled = true;
                detenerMicrofono();
            }
        };

        socket.onerror = () => {
            estado.textContent = "No se pudo conectar al servidor.";
        };

        socket.onclose = () => {
            detenerMicrofono();
            botonMicrofono.disabled = true;
            estado.textContent = "Conexión cerrada.";
        };
    }

    async function activarMicrofono() {
        try {
            if (audioContext) {
                await detenerMicrofono();
            }

            stream = await navigator.mediaDevices.getUserMedia({
                audio: true
            });

            audioContext = new AudioContext();

            await audioContext.resume();

            const codigoProcesador = `
                class DetectorVoz extends AudioWorkletProcessor {
                    constructor() {
                        super();
                        this.hablando = false;
                    }

                    process(inputs, outputs) {
                        const entrada = inputs[0];

                        if (entrada && entrada[0]) {
                            const muestras = entrada[0];
                            let suma = 0;

                            for (let i = 0; i < muestras.length; i++) {
                                suma += muestras[i] * muestras[i];
                            }

                            const volumen = Math.sqrt(suma / muestras.length);
                            const nuevoEstado = volumen > 0.035;

                            if (nuevoEstado !== this.hablando) {
                                this.hablando = nuevoEstado;
                                this.port.postMessage(this.hablando);
                            }
                        }

                        for (const salida of outputs) {
                            for (const canal of salida) {
                                canal.fill(0);
                            }
                        }

                        return true;
                    }
                }

                registerProcessor("detector-voz", DetectorVoz);
            `;

            const blob = new Blob([codigoProcesador], {
                type: "application/javascript"
            });

            const url = URL.createObjectURL(blob);

            await audioContext.audioWorklet.addModule(url);

            URL.revokeObjectURL(url);

            fuente = audioContext.createMediaStreamSource(stream);

            nodoVoz = new AudioWorkletNode(audioContext, "detector-voz", {
                numberOfInputs: 1,
                numberOfOutputs: 1,
                outputChannelCount: [1]
            });

            nodoVoz.port.onmessage = (evento) => {
                if (!socket || socket.readyState !== WebSocket.OPEN) {
                    return;
                }

                hablando = evento.data;

                socket.send(JSON.stringify({
                    tipo: "voz",
                    hablando
                }));

                estado.textContent = hablando
                    ? "¡Moni está hablando!"
                    : "Micrófono activo. En silencio.";
            };

            fuente.connect(nodoVoz);
            nodoVoz.connect(audioContext.destination);

            botonMicrofono.disabled = true;
            estado.textContent = "Micrófono activo. ¡Puedes hablar!";

        } catch (error) {
            console.error("Error al activar el micrófono:", error);

            await detenerMicrofono();

            estado.textContent = "No se pudo activar el micrófono.";
        }
    }

    async function detenerMicrofono() {
        if (nodoVoz) {
            nodoVoz.port.onmessage = null;
            nodoVoz.disconnect();
            nodoVoz = null;
        }

        if (fuente) {
            fuente.disconnect();
            fuente = null;
        }

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        if (audioContext) {
            const contextoAnterior = audioContext;
            audioContext = null;

            if (contextoAnterior.state !== "closed") {
                await contextoAnterior.close();
            }
        }

        hablando = false;
    }

    window.addEventListener("beforeunload", detenerMicrofono);
</script>
</body>
</html>
